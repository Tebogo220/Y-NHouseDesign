
<!doctype html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="Transform your home with expert interior and exterior styling services. At Y&N House Design, we create stunning, personalized design to enhance your living spaces and curb appeal. Contact us for modern home styling solutions today!.">
		<meta name="keywords" content="interior styling, exterior styling, home decor services, modern designs, personalized home design">
		<meta name="author" content="Y&N House Design">
		<title>OurWork Page - Y&N House Design</title>
		<style>
			body {
				display: inline-block;
				font-family: Arial, sans-serif; 
				background: lightgrey;
				margin: 0;
			}
			
			.gallery { 
				display: flex; 
				flex-wrap: wrap;
				gap: 10px;
				margin: 10px;
			}
			
			.gallery-item {
				
                display: grid;
				gap:10px;
				text-align: center; 
			}
			.gallery-item img {
				height: 300px;
				width: 230px;
				border: 2px solid blue;
				border-radius: 5px;
				width: 100%;
				border-radius: 5px;
                transition: transform 0.3s;
            }
            .gallery-item img:hover{
                transform: scale(1.05);
            }
			#nav-bar{
				display: flex;
			}
			
			#nav-bar li{
				list-style: none;
				margin: 0 15px;
			}
			
			#nav-bar li a{
				text-decoration: none;
				color: white;
				border-radius: 5px;
				padding: 2px 7px;
				background-color: #555;
			}
			
			#current{
				color: black;
				font-weight: bold;
			}
			
			#divider{
			border: 2px solid orange;
			margin-top: 10px;
			}
/*=======================Modal================*/
            .modal {
                display: none;
                position: fixed;
				top: 0;
				left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.8);
                justify-content: center;
                align-items: center;
                z-index: 10;
            }
        
            .modal img {
                max-width: 100%;
                max-height: 100%;
                position: fixed;
				top: 40px;
                border-radius: 10px;
            }
            .close{
                position: absolute;
                top: 5px;
                right: 30px;
                color: white;
                font-size: 30px;
                font-weight: bold;
                cursor: pointer;
            }
            .close:hover{
                color: red;
            }
			
			@media only screen and (max-width: 425px){
			    #nav-bar{
			        font-size:1.3em;
			    }
			}
			
		</style>
	</head>
	<body>
		<div id="header">
			<img src="images/site-header.png" alt="headerBox" style="width: 100%; height: 100%; object-fit: cover;">
			<ul id="nav-bar">
				<li><a href="index.html">Home</a></li>
				<li><a href="gallery.html"><span id="current">OurWork</span></a></li>
				<li><a href="contact.html">Contacts</a></li>
			</ul>
		</div>	
		
		<div id="divider"></div>
		<div id="imageList" class="gallery">
			<!-- Dynamically filled by JS  -->
		</div>
		
        <div id="imageModal" class="modal" >
            <span class="close" id="closeModal" >&times;</span>
            <img id="modalImage" src="" alt="Preview Image">
        </div>

		<script>
			// Fetch and display images using a relative URL
			async function fetchImages() {
				try {
					// Fetch images from the server
					const response = await fetch('/get-images'); // Relative URL
					const images = await response.json();
					const imageList = document.getElementById('imageList');
					imageList.innerHTML = ''; // Clear previous images

					// Display each image
					images.forEach(image => {
						const imageItem = document.createElement('div');
						imageItem.classList.add('gallery-item');
						imageItem.innerHTML = `<img src="${image.url}" alt="${image.id}" />`; // Use relative image URL
						imageList.appendChild(imageItem);
					});

					// Add event listeners for modal
					document.querySelectorAll('.gallery-item img').forEach(img => {
						img.addEventListener('click', openModal);
					});
				} catch (error) {
					console.error("Error fetching images:", error);
				}
			}

			// Open modal
			function openModal(event) {
				if(!sessionStorage.getItem("alertShown")){
					alert("Double tab or double click to download this picture!");
					sessionStorage.setItem("alertShown","true");
				}
				const modal = document.getElementById('imageModal');
				const modalImg = document.getElementById('modalImage');
				modal.style.display = 'block';
				modalImg.src = event.target.src;
			}

			// Close modal
			document.getElementById('closeModal').onclick = function() {
				document.getElementById('imageModal').style.display = 'none';
			};
			
			modalImage.ondblclick = (event) => {
				event.preventDefault();
				event.stopPropagation();

				const link = document.createElement("a");
				link.href = modalImage.src;
				link.download = modalImage.src.split("/").pop();
				document.body.appendChild(link);
				link.click();
				document.body.removeChild(link);
			};

			// Initial fetch to display images on load
			fetchImages();
		</script>
	</body>
</html>
